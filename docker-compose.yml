name: moderndvwa

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - labs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      SERVER_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_DSN: ${DATABASE_DSN}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - labs-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  labs-net:
    driver: bridge

volumes:
  pgdata:
