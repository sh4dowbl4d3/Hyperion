server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable cache for index.html so SPA updates appear immediately without hard refresh
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets with content-hash can be cached
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static SPA assets: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls are proxied to the backend service inside the compose network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
